<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>이용 안내</title>
<script type="text/javascript">
function fnToggle(id) {
    var el = document.getElementById(id);
    el.style.display = (el.style.display == "none") ? "block" : "none";
    return false;
}
</script>
</head>
<body>
<h1>이용 안내</h1>
<p><a href="#" onclick="return fnToggle('detail');">자세히 보기</a></p>
<div id="detail" style="display:none">주문 목록에서 검색 후 주문을 수정할 수 있습니다.</div>
</body>
</html>
