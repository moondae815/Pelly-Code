name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -warnaserror
      - name: Unit tests (no Env trait)
        run: dotnet test --no-build -- --filter-not-trait "Env=Windows" --filter-not-trait "Env=SqlServer" --filter-not-trait "Env=Ollama"
      - name: Modern corpus build and tests
        run: |
          dotnet build eval/corpus/Modern/Modern.sln -warnaserror
          dotnet test eval/corpus/Modern/Shop.Api.Tests --no-build

  windows-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -warnaserror
      # 테스트가 eval/corpus/Legacy/packages 를 쓰므로 Windows tests 보다 먼저 복원·빌드한다
      - name: Legacy corpus build and tests
        shell: pwsh
        run: ./eval/corpus/Legacy/build.ps1
      - name: Windows tests
        # 환경이 빠져 Skip되거나 필터 오타로 0개가 되면 실패해야 한다. 패키지 테스트는 zip이 있는 package 잡에서 돈다
        run: dotnet test tests/PellyCoder.Integration.Tests --no-build -- --filter-trait "Env=Windows" --filter-not-class "PellyCoder.Integration.Tests.Package.PackageTests" --fail-skips on --minimum-expected-tests 1

  publish-check:
    # 반입본(PRD §11.1)이 SQL·Ollama 없이 자기 점검을 통과하는지 확인한다 (spike S6)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish win-x64 single file
        run: dotnet publish src/PellyCoder.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=none -o artifacts/publish/win-x64
      - name: Check published exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path artifacts/publish/win-x64/pelly.exe
          Get-ChildItem artifacts/publish/win-x64 | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          $size = (Get-Item $exe).Length
          Write-Host ("pelly.exe size: {0} bytes ({1:N1} MB)" -f $size, ($size / 1MB))

          # 첫 실행은 네이티브 라이브러리를 새 폴더에 풀므로 따로 잰다
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:RUNNER_TEMP 'pelly-extract'
          foreach ($run in 'first', 'second') {
            $t = Measure-Command { & $exe doctor --offline-selftest | Out-Host }
            if ($LASTEXITCODE -ne 0) { throw "doctor --offline-selftest ($run) exit $LASTEXITCODE" }
            Write-Host ("offline-selftest {0} run: {1:N2} s" -f $run, $t.TotalSeconds)
          }
          Get-ChildItem -Recurse -File $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR | ForEach-Object { Write-Host "extracted: $($_.FullName) $($_.Length)" }

          $version = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "--version exit $LASTEXITCODE" }
          Write-Host "version: $version"
          if (-not $version.StartsWith('0.9.1')) { throw "unexpected version: $version" }

          & $exe cs --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "cs --help exit $LASTEXITCODE" }

          # Cli 어셈블리의 포함 리소스(서버 확인 사항)를 단일 파일에서 찾는지 본다. 닫힌 루프백 포트만 쓴다(Ollama Fail → 종료 4)
          $out = (& $exe doctor --endpoint http://127.0.0.1:1 --model none | Out-String)
          if ($LASTEXITCODE -ne 4) { throw "doctor (no server) exit $LASTEXITCODE, expected 4" }
          if (-not $out.Contains('OLLAMA_KV_CACHE_TYPE')) { Write-Host $out; throw 'server checklist resource missing' }
          # 마지막 네이티브 명령이 의도대로 4로 끝났으므로, 그 값이 스텝 종료 코드가 되지 않게 끝낸다
          exit 0
      - name: Upload published exe for the package job
        uses: actions/upload-artifact@v4
        with:
          name: pelly-publish-win-x64
          path: artifacts/publish/win-x64/pelly.exe
          if-no-files-found: error
          retention-days: 1
      - name: Publish pelly-eval win-x64 single file
        # 현장 키트(M4 Task 9). csproj의 win-x64 조건부 속성만으로 단일 파일이 나와야 한다
        run: dotnet publish eval/PellyCoder.Eval -c Release -r win-x64 -o artifacts/publish-eval/win-x64
      - name: Check published pelly-eval.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem artifacts/publish-eval/win-x64 | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          $exe = Resolve-Path artifacts/publish-eval/win-x64/pelly-eval.exe
          $size = (Get-Item $exe).Length
          Write-Host ("pelly-eval.exe size: {0} bytes ({1:N1} MB)" -f $size, ($size / 1MB))
          if (Get-ChildItem artifacts/publish-eval/win-x64 -Filter *.pdb) { throw 'pdb in the publish folder' }
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:RUNNER_TEMP 'pelly-eval-extract'

          & $exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "--help exit $LASTEXITCODE" }

          # 내장 스위트가 Windows에서 Legacy 루트를 바르게 판정하는지 본다 (정적 검사, 서버 없음)
          $out = (& $exe validate --suite eval/benchmark | Out-String)
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "validate --suite eval/benchmark exit $code" }
          if (-not $out.Contains('오류 0건')) { throw 'validate output lacks the totals line' }
          exit 0
      - name: Upload published pelly-eval.exe for the package job
        uses: actions/upload-artifact@v4
        with:
          name: pelly-eval-publish-win-x64
          path: artifacts/publish-eval/win-x64/pelly-eval.exe
          if-no-files-found: error
          retention-days: 1

  package:
    # 반입 zip (Task 9). publish-check가 만든 exe를 그대로 쓴다 (publish는 한 번만 한다)
    needs: publish-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: pelly-publish-win-x64
          path: artifacts/publish/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: pelly-eval-publish-win-x64
          path: artifacts/publish-eval/win-x64
      - name: License gate rejects a changed exception (dry run)
        # 승인한 예외의 버전이나 라이선스 파일 해시가 바뀌면 패키지 빌드가 실패해야 한다. 저장소 파일은 건드리지 않는다
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $orig = Get-Content -Raw deploy/license-exceptions.json
          foreach ($case in @(@{ key = 'version'; value = '7.0.0' }, @{ key = 'licenseFileSha256'; value = ('0' * 64) })) {
            $ex = @($orig | ConvertFrom-Json -AsHashtable)
            $ex[0][$case.key] = $case.value
            $altered = Join-Path $env:RUNNER_TEMP "exceptions-$($case.key).json"
            ConvertTo-Json -InputObject $ex -Depth 8 | Set-Content $altered
            $out = & pwsh -NoProfile -File ./deploy/build-package.ps1 -PublishDir artifacts/publish/win-x64 -OutDir (Join-Path $env:RUNNER_TEMP 'gate-check') -LicenseExceptions $altered 2>&1 | Out-String
            $code = $LASTEXITCODE
            if ($code -eq 0) { throw "gate passed with a changed $($case.key)" }
            foreach ($want in 'license exception matched no component', 'license not allowed: Microsoft.Data.SqlClient.SNI.runtime 7.1.0') {
              if (-not $out.Contains($want)) { Write-Host $out; throw "changed $($case.key): output lacks '$want'" }
            }
            Write-Host "changed $($case.key): gate failed as expected (exit $code)"
          }
          # 마지막 네이티브 명령(일부러 실패시킨 빌드)의 종료 코드가 스텝 종료 코드가 되지 않게 끝낸다
          exit 0
      - name: License gate rejects a provisional approval in 1.0 (dry run)
        # 버전이 1.0.0 이상이면 approvedBy에 「잠정」이 든 예외로는 패키지가 만들어지면 안 된다. 저장소 파일은 건드리지 않는다
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not ((Get-Content -Raw deploy/license-exceptions.json) -match '잠정')) { throw 'precondition: no provisional approval to test with' }
          $props = Join-Path $env:RUNNER_TEMP 'Directory.Build.1.0.0.props'
          (Get-Content -Raw Directory.Build.props) -replace '<Version>[^<]*</Version>', '<Version>1.0.0</Version>' | Set-Content $props
          if (-not ((Get-Content -Raw $props) -match '<Version>1\.0\.0</Version>')) { throw 'altered props lacks Version 1.0.0' }
          $out = & pwsh -NoProfile -File ./deploy/build-package.ps1 -PublishDir artifacts/publish/win-x64 -OutDir (Join-Path $env:RUNNER_TEMP 'gate-check-1.0') -BuildProps $props 2>&1 | Out-String
          $code = $LASTEXITCODE
          if ($code -eq 0) { throw 'gate passed a provisional approval in 1.0.0' }
          if (-not $out.Contains('provisional approval cannot ship in 1.0.0')) { Write-Host $out; throw "output lacks the provisional-approval message" }
          Write-Host "version 1.0.0: gate failed as expected (exit $code)"
          exit 0
      - name: Build package
        shell: pwsh
        run: |
          ./deploy/build-package.ps1 -PublishDir artifacts/publish/win-x64 -OutDir artifacts/package
          $zip = @(Get-ChildItem artifacts/package -Filter 'pelly-*-win-x64.zip')
          if ($zip.Count -ne 1) { throw "expected one zip, found $($zip.Count)" }
          "PELLY_TEST_PACKAGE=$($zip[0].FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # zip 자체의 SHA-256: 로그에 남기고, zip과 따로 전달할 수 있게 별도 아티팩트 파일로 둔다 (install.md 2절)
          $hash = (Get-FileHash $zip[0].FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "zip sha256: $hash  $($zip[0].Name)"
          $shaDir = New-Item -ItemType Directory -Force artifacts/package-sha256
          $shaFile = Join-Path $shaDir "$($zip[0].Name).sha256"
          [System.IO.File]::WriteAllText($shaFile, "$hash  $($zip[0].Name)`n")
          "PELLY_PACKAGE_SHA256_FILE=$shaFile" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build field kit
        # 현장 키트 zip (M4 Task 9). 라이선스 게이트·예외 파일·1.0 잠정 승인 거부는 반입 zip과 같다
        shell: pwsh
        run: |
          ./deploy/build-package.ps1 -Package field-kit -PublishDir artifacts/publish-eval/win-x64 -OutDir artifacts/field-kit
          $zip = @(Get-ChildItem artifacts/field-kit -Filter 'pelly-field-kit-*-win-x64.zip')
          if ($zip.Count -ne 1) { throw "expected one zip, found $($zip.Count)" }
          "PELLY_TEST_FIELD_KIT=$($zip[0].FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $hash = (Get-FileHash $zip[0].FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "zip sha256: $hash  $($zip[0].Name)"
          $shaDir = New-Item -ItemType Directory -Force artifacts/field-kit-sha256
          $shaFile = Join-Path $shaDir "$($zip[0].Name).sha256"
          [System.IO.File]::WriteAllText($shaFile, "$hash  $($zip[0].Name)`n")
          "PELLY_FIELD_KIT_SHA256_FILE=$shaFile" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Check SHA256SUMS the way install.md does
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($case in @(@{ zip = $env:PELLY_TEST_PACKAGE; count = 12 }, @{ zip = $env:PELLY_TEST_FIELD_KIT; count = 11 })) {
            $dir = Join-Path $env:RUNNER_TEMP ('unzip-' + [System.IO.Path]::GetFileNameWithoutExtension($case.zip))
            Expand-Archive $case.zip $dir
            Push-Location $dir
            try {
              # install.md 2절의 명령 그대로
              $result = Get-Content .\SHA256SUMS.txt | ForEach-Object {
                $hash, $file = $_ -split '  ', 2
                $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
                if ($actual -eq $hash) { "OK  $file" } else { "다름  $file" }
              }
            }
            finally { Pop-Location }
            Write-Host "== $([System.IO.Path]::GetFileName($case.zip))"
            $result | Out-Host
            if ($result -notmatch '\AOK  ') { throw "checksum mismatch in $($case.zip)" }
            if (@($result).Count -ne $case.count) { throw "expected $($case.count) checked files in $($case.zip), got $(@($result).Count)" }
          }
      - name: Build tests
        run: dotnet build tests/PellyCoder.Integration.Tests -warnaserror
      - name: Package tests
        # zip이 없거나 Skip되거나 필터 오타로 수가 모자라면 실패해야 한다
        run: dotnet test tests/PellyCoder.Integration.Tests --no-build -- --filter-class "PellyCoder.Integration.Tests.Package.PackageTests" --fail-skips on --minimum-expected-tests 12 --report-xunit-trx --results-directory artifacts/package-tests
      - name: List package test results
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/package-tests)) { Write-Host 'no TRX (tests did not run)'; exit 0 }
          Get-ChildItem artifacts/package-tests -Filter *.trx | ForEach-Object {
            ([xml](Get-Content -Raw $_.FullName)).TestRun.Results.UnitTestResult | ForEach-Object { "$($_.outcome)  $($_.testName)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: pelly-package
          path: ${{ env.PELLY_TEST_PACKAGE }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: pelly-package-sha256
          path: ${{ env.PELLY_PACKAGE_SHA256_FILE }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: pelly-field-kit
          path: ${{ env.PELLY_TEST_FIELD_KIT }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: pelly-field-kit-sha256
          path: ${{ env.PELLY_FIELD_KIT_SHA256_FILE }}
          if-no-files-found: error
          retention-days: 14

  sql-integration:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Pelly_Test_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Pelly_Test_2026!' -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      PELLY_TEST_SQL: "Server=localhost,1433;Database=PellyCorpus;User Id=sa;Password=Pelly_Test_2026!;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -warnaserror
      - name: Deploy SQL corpus
        run: ./eval/corpus/Sql/deploy.sh "${{ job.services.mssql.id }}" 'Pelly_Test_2026!'
      - name: SQL Server tests
        # 환경이 빠져 Skip되거나 필터 오타로 0개가 되면 실패해야 한다
        run: dotnet test tests/PellyCoder.Integration.Tests --no-build -- --filter-trait "Env=SqlServer" --fail-skips on --minimum-expected-tests 1
